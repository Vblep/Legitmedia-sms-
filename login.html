<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Legit Media SMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .shimmer { background: linear-gradient(90deg, #4f46e5, #7c3aed); }
        .input-style { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); color: white; transition: all 0.3s; }
        .input-style:focus { border-color: #6366f1; border-width: 2px; outline: none; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md space-y-8 relative">
        <div class="text-center space-y-2">
            <div class="w-16 h-16 shimmer rounded-2xl mx-auto flex items-center justify-center shadow-2xl animate-float">
                <span class="text-white font-black text-2xl">LM</span>
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight pt-4">Welcome Back</h1>
            <p class="text-slate-400 text-sm font-medium uppercase tracking-[0.1em]">Secure Access — VI-HUB</p>
        </div>

        <div class="glass-card rounded-[2.5rem] p-8 shadow-2xl relative overflow-hidden">
            <div id="loadingOverlay" class="absolute inset-0 z-50 bg-slate-900/90 flex items-center justify-center hidden">
                <div class="flex flex-col items-center space-y-4">
                    <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-indigo-400 font-bold text-[10px] uppercase tracking-widest">Entering Dashboard...</p>
                </div>
            </div>

            <div class="space-y-5">
                <div class="space-y-1.5">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" 
                        class="w-full p-4 rounded-2xl input-style font-semibold text-sm">
                </div>

                <div class="space-y-1.5">
                    <div class="flex justify-between items-center px-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Password</label>
                        <button onclick="forgotPassword()" class="text-[10px] font-bold text-indigo-400 hover:text-indigo-300 uppercase tracking-widest">Reset Password?</button>
                    </div>
                    <div class="relative">
                        <input type="password" id="password" placeholder="••••••••" 
                            class="w-full p-4 rounded-2xl input-style font-semibold text-sm pr-12">
                        <button onclick="togglePass('password')" class="absolute right-4 top-4 text-slate-500 hover:text-indigo-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-width="2"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-width="2"/></svg>
                        </button>
                    </div>
                </div>

                <div class="flex items-center space-x-2 px-1">
                    <input type="checkbox" id="remember" class="w-4 h-4 rounded border-slate-700 bg-slate-800 text-indigo-600 focus:ring-indigo-500">
                    <label for="remember" class="text-xs font-bold text-slate-400 uppercase tracking-widest cursor-pointer">Stay Logged In</label>
                </div>

                <div id="message" class="text-center text-xs font-bold text-rose-500 hidden px-2 py-3 bg-rose-500/10 rounded-xl"></div>

                <button onclick="login()" class="w-full py-5 shimmer text-white rounded-2xl font-black uppercase tracking-widest text-xs shadow-xl shadow-indigo-500/20 active:scale-[0.98] transition-all">
                    Unlock Dashboard
                </button>
            </div>
        </div>

        <p class="text-center text-slate-500 text-sm font-semibold">
            New here? 
            <a href="register.html" class="text-indigo-400 hover:text-indigo-300 underline underline-offset-4 ml-1">Create an account</a>
        </p>
    </div>

<script>
// --- CONFIG ---
const SUPABASE_URL = "https://gfhbwybslaxgdzcqkzra.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmaGJ3eWJzbGF4Z2R6Y3FrenJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NzI1NDUsImV4cCI6MjA4NzU0ODU0NX0.EkmUwtBi9OiScuMt9PELS6-vDXgQVofvadJ8aLFvyKo";
const EDGE_FUNCTION_URL = "https://gfhbwybslaxgdzcqkzra.supabase.co/functions/v1/send-emails";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// --- UTILITIES ---
function togglePass(id) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}

function showMsg(txt, isError = true) {
    const el = document.getElementById("message");
    el.innerText = txt;
    el.classList.remove("hidden");
    el.className = isError 
        ? "text-center text-xs font-bold text-rose-500 px-2 py-3 bg-rose-500/10 rounded-xl block"
        : "text-center text-xs font-bold text-emerald-500 px-2 py-3 bg-emerald-500/10 rounded-xl block";
}

// Send Login Notification Email
async function sendLoginNotification(email, fullName = "User") {
    try {
        const deviceInfo = {
            browser: navigator.userAgent,
            os: navigator.platform,
            time: new Date().toLocaleString(),
            // IP can be added from server-side if needed
        };

        const response = await fetch(EDGE_FUNCTION_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
            },
            body: JSON.stringify({
                type: "login",
                email: email,
                full_name: fullName,
                deviceInfo: deviceInfo
            })
        });

        if (response.ok) {
            console.log("✅ Login notification sent successfully to:", email);
        } else {
            console.warn("Login notification response:", await response.text());
        }
    } catch (e) {
        console.warn("⚠️ Login notification failed:", e.message);
    }
}

// --- CORE LOGIC ---
async function login() {
    const loader = document.getElementById("loadingOverlay");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) return showMsg("Credentials required.");

    loader.classList.remove("hidden");
    
    try {
        const { error } = await client.auth.signInWithPassword({ email, password });

        if (error) {
            loader.classList.add("hidden");
            showMsg(error.message);
        } else {
            // Send Login Notification
            sendLoginNotification(email);

            showMsg("Login successful! 🎉", false);
            
            // Small delay then redirect
            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 1200);
        }
    } catch (err) {
        loader.classList.add("hidden");
        showMsg("Network error. Please try again.");
    }
}

async function forgotPassword() {
    const email = document.getElementById("email").value.trim();
    if (!email) return showMsg("Enter your email to receive a reset link.");

    const { error } = await client.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + "/reset-password.html"
    });

    if (error) showMsg(error.message);
    else showMsg("Instructions sent to your email!", false);
}

// --- SESSION CLEANER ---
async function initLogin() {
    await client.auth.signOut();
}

initLogin();
</script>
</body>
</html>
