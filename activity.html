<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity History - Legit Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .tab-active { color: #4f46e5; border-bottom: 3px solid #4f46e5; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen pb-10">

    <nav class="sticky top-0 z-50 bg-white border-b px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <a href="dashboard.html" class="p-2 hover:bg-slate-100 rounded-full transition-all">
                <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <h1 class="text-xl font-black text-slate-900 uppercase">Activity <span class="text-indigo-600">Log</span></h1>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4 md:p-8">
        <div class="flex border-b border-slate-200 mb-8">
            <button onclick="switchTab('orders')" id="tab-orders" class="flex-1 py-4 text-sm font-black uppercase tracking-widest text-slate-400 tab-active">Orders</button>
            <button onclick="switchTab('funds')" id="tab-funds" class="flex-1 py-4 text-sm font-black uppercase tracking-widest text-slate-400">Funding</button>
        </div>

        <div id="section-orders" class="space-y-4">
            <div id="orders-list" class="space-y-4">
                <div class="text-center py-20 text-slate-400 text-sm font-bold">Loading your orders...</div>
            </div>
        </div>

        <div id="section-funds" class="space-y-4 hidden">
            <div id="funds-list" class="space-y-4">
                </div>
        </div>
    </main>

    <script>
        const SB_URL = "https://gfhbwybslaxgdzcqkzra.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmaGJ3eWJzbGF4Z2R6Y3FrenJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NzI1NDUsImV4cCI6MjA4NzU0ODU0NX0.EkmUwtBi9OiScuMt9PELS6-vDXgQVofvadJ8aLFvyKo";
        const sb = supabase.createClient(SB_URL, SB_KEY);

        function switchTab(type) {
            const isOrders = type === 'orders';
            document.getElementById('section-orders').classList.toggle('hidden', !isOrders);
            document.getElementById('section-funds').classList.toggle('hidden', isOrders);
            document.getElementById('tab-orders').classList.toggle('tab-active', isOrders);
            document.getElementById('tab-funds').classList.toggle('tab-active', !isOrders);
        }

        async function loadHistory() {
            const { data: { user } } = await sb.auth.getUser();
            if (!user) return;

            // 1. Fetch Purchased Numbers (Orders)
            const { data: orders } = await sb.from('purchased_numbers')
                .select('*')
                .eq('user_id', user.id)
                .order('created_at', { ascending: false });

            const ordersCont = document.getElementById('orders-list');
            ordersCont.innerHTML = orders?.length ? orders.map(o => `
                <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm flex justify-between items-center group hover:border-indigo-200 transition-all">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-[10px] font-black text-indigo-600 uppercase tracking-tighter">${o.service}</span>
                            <span class="text-[10px] text-slate-300">•</span>
                            <span class="text-[10px] text-slate-400 font-bold">${new Date(o.created_at).toLocaleDateString()}</span>
                        </div>
                        <h3 class="text-lg font-black text-slate-800">${o.number}</h3>
                    </div>
                    <div class="text-right">
                        <p class="text-xs font-black ${o.otp ? 'text-emerald-500' : 'text-amber-500 animate-pulse'}">
                            ${o.otp || 'AWAITING SMS...'}
                        </p>
                        <p class="text-[9px] font-bold text-slate-300 uppercase mt-1">Status: ${o.otp ? 'Completed' : 'Active'}</p>
                    </div>
                </div>
            `).join('') : '<div class="text-center py-20 text-slate-400 font-bold">No orders found.</div>';

            // 2. Fetch Transactions (Funding)
            const { data: txs } = await sb.from('transactions')
                .select('*')
                .eq('user_id', user.id)
                .order('created_at', { ascending: false });

            const fundsCont = document.getElementById('funds-list');
            fundsCont.innerHTML = txs?.length ? txs.map(t => `
                <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl ${t.type.toLowerCase().includes('deposit') ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-50 text-slate-600'} flex items-center justify-center">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="2"/></svg>
                        </div>
                        <div>
                            <p class="text-xs font-black uppercase text-slate-400 tracking-widest">${t.type}</p>
                            <p class="text-[10px] font-bold text-slate-300">${new Date(t.created_at).toLocaleString()}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-lg font-black ${t.type.toLowerCase().includes('deposit') ? 'text-emerald-500' : 'text-slate-900'}">
                            ${t.type.toLowerCase().includes('deposit') ? '+' : '-'} ₦${Number(t.amount).toLocaleString()}
                        </p>
                        <span class="text-[9px] font-black uppercase px-2 py-0.5 rounded ${t.status === 'success' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">
                            ${t.status}
                        </span>
                    </div>
                </div>
            `).join('') : '<div class="text-center py-20 text-slate-400 font-bold">No transactions found.</div>';
        }

        window.onload = loadHistory;
    </script>
</body>
</html>
