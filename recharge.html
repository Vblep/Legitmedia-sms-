<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Up Wallet - Legit Media SMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://checkout.flutterwave.com/v3.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .shimmer { background: linear-gradient(90deg, #4f46e5, #7c3aed); border: none; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .btn-active:active { transform: scale(0.96); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen text-slate-800 pb-12">

    <nav class="bg-white border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='dashboard.html'">
                    <div class="w-8 h-8 shimmer rounded-lg flex items-center justify-center shadow-lg shadow-indigo-200">
                        <span class="text-white font-bold text-xs">LM</span>
                    </div>
                    <span class="font-extrabold text-xl tracking-tight text-slate-900 uppercase">LEGIT<span class="text-indigo-600">MEDIA</span></span>
                </div>
                <div class="flex items-center gap-4">
                    <div id="user-initials" class="w-10 h-10 rounded-full bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600 font-bold text-xs uppercase tracking-tighter">..</div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-lg mx-auto px-4 mt-12 space-y-6">
        
        <div class="glass-card rounded-[2.5rem] p-8 shadow-2xl shadow-indigo-100/50 space-y-8">
            <div class="text-center">
                <h2 class="text-2xl font-black text-slate-900 tracking-tight">Top Up Wallet</h2>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">Instant Auto-Funding</p>
            </div>

            <div class="space-y-4">
                <div class="relative">
                    <label class="text-[10px] font-bold text-slate-400 ml-1 uppercase tracking-widest">Amount to Deposit (NGN)</label>
                    <div class="mt-1.5 relative">
                        <span class="absolute left-5 top-4 font-black text-indigo-600 text-lg">₦</span>
                        <input type="number" id="amount" placeholder="Min. 500" 
                            class="w-full p-4 pl-10 bg-slate-50 border border-slate-200 rounded-2xl font-black text-lg outline-none focus:ring-2 focus:ring-indigo-500 transition-all shadow-sm">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setAmount(1000)" class="py-3 bg-white border border-slate-100 hover:bg-indigo-600 hover:text-white rounded-xl text-[10px] font-black transition-all shadow-sm">₦1,000</button>
                    <button onclick="setAmount(2000)" class="py-3 bg-white border border-slate-100 hover:bg-indigo-600 hover:text-white rounded-xl text-[10px] font-black transition-all shadow-sm">₦2,000</button>
                    <button onclick="setAmount(5000)" class="py-3 bg-white border border-slate-100 hover:bg-indigo-600 hover:text-white rounded-xl text-[10px] font-black transition-all shadow-sm">₦5,000</button>
                </div>
            </div>

            <button id="payBtn" onclick="payWithFlutterwave()" class="w-full py-5 bg-slate-900 text-white rounded-2xl font-black uppercase tracking-widest text-[10px] shadow-xl hover:bg-slate-800 btn-active transition-all">
                Authorize Payment
            </button>

            <div class="flex items-center justify-center gap-4 pt-2 opacity-40 grayscale">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Mastercard-logo.svg/1280px-Mastercard-logo.svg.png" class="h-4">
                <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Verified by Flutterwave</span>
            </div>
        </div>

        <div class="bg-indigo-600 rounded-[2rem] p-7 text-white flex justify-between items-center shadow-xl shadow-indigo-100">
            <div>
                <p class="text-[10px] font-bold opacity-70 uppercase tracking-widest mb-1">Current Wallet</p>
                <h3 id="current-balance" class="text-3xl font-black tracking-tighter">₦0.00</h3>
            </div>
            <div class="p-4 bg-white/10 rounded-2xl border border-white/10">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="2.5"/></svg>
            </div>
        </div>
    </main>

    <script>
        // Supabase Configuration
        const SB_URL = "https://gfhbwybslaxgdzcqkzra.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmaGJ3eWJzbGF4Z2R6Y3FrenJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NzI1NDUsImV4cCI6MjA4NzU0ODU0NX0.EkmUwtBi9OiScuMt9PELS6-vDXgQVofvadJ8aLFvyKo"; 
        
        // Flutterwave Configuration (Ensure you update with your Live key when ready)
        const FLW_PUB_KEY = "FLWPUBK_TEST-9599e7eead82c5134f4f57e4676f0172-X";

        const sb = supabase.createClient(SB_URL, SB_KEY);
        let userProfile = null;
        let currentUserData = null;

        // Initialize user session and profile
        async function init() {
            const { data: { user } } = await sb.auth.getUser();
            if (!user) { window.location.href = 'login.html'; return; }
            currentUserData = user;

            const { data: profile, error } = await sb.from('profiles').select('*').eq('id', user.id).single();
            if (error || !profile) {
                console.error("Profile not found:", error);
                return;
            }
            
            userProfile = profile;
            document.getElementById('current-balance').innerText = "₦" + Number(profile.wallet_balance || 0).toLocaleString('en-NG', {minimumFractionDigits: 2});
            
            const displayName = profile.full_name || profile.username || user.email;
            document.getElementById('user-initials').innerText = displayName.substring(0, 2).toUpperCase();
        }

        // Helper to set quick amounts
        function setAmount(val) {
            document.getElementById('amount').value = val;
        }

        // Flutterwave Payment Integration
        function payWithFlutterwave() {
            const amountField = document.getElementById('amount');
            const amount = parseFloat(amountField.value);
            const btn = document.getElementById('payBtn');
            
            if (!amount || amount < 500) {
                alert("The minimum deposit allowed is ₦500.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "OPENING SECURE GATEWAY...";

            FlutterwaveCheckout({
                public_key: FLW_PUB_KEY,
                tx_ref: "LM-DEP-" + Date.now() + "-" + Math.floor(Math.random() * 1000),
                amount: amount,
                currency: "NGN",
                payment_options: "card, banktransfer, ussd",
                customer: {
                    email: currentUserData.email,
                    name: userProfile.full_name || "Legit Media User",
                },
                customizations: {
                    title: "Legit Media SMS",
                    description: "Wallet Funding Service",
                    logo: "https://img.icons8.com/ios-filled/100/4f46e5/rocket.png",
                },
                callback: async function (response) {
                    btn.innerText = "VERIFYING & CREDITING...";
                    
                    if (response.status === "successful" || response.status === "completed") {
                        
                        // 1. Log the transaction to the NEW transactions table
                        // This table powers the dashboard's "Financial Records" and "Lifetime Funding"
                        const { error: txError } = await sb.from('transactions').insert([{
                            user_id: currentUserData.id,
                            amount: amount,
                            type: 'Deposit',
                            status: 'success',
                            description: 'Wallet funding via Flutterwave'
                        }]);

                        if (txError) {
                            console.error("Error logging transaction:", txError);
                        }

                        // 2. Fetch the most recent balance from the database
                        const { data: latestProfile, error: fetchError } = await sb.from('profiles')
                            .select('wallet_balance')
                            .eq('id', currentUserData.id)
                            .single();

                        if (fetchError) {
                            console.error("Error fetching balance:", fetchError);
                            return;
                        }

                        // 3. Calculate and Update the Wallet Balance
                        const currentWallet = Number(latestProfile.wallet_balance || 0);
                        const updatedWallet = currentWallet + amount;

                        const { error: updateErr } = await sb.from('profiles')
                            .update({ wallet_balance: updatedWallet })
                            .eq('id', currentUserData.id);

                        if (!updateErr) {
                            alert(`Success! ₦${amount.toLocaleString()} has been added to your wallet.`);
                            window.location.href = "dashboard.html";
                        } else {
                            console.error("Balance Update Error:", updateErr);
                            alert("Payment confirmed. Redirecting to your dashboard to refresh balance.");
                            window.location.href = "dashboard.html";
                        }
                    } else {
                        alert("The payment was not successful. Please try again.");
                        btn.disabled = false;
                        btn.innerText = "Authorize Payment";
                    }
                },
                onclose: function() {
                    btn.disabled = false;
                    btn.innerText = "Authorize Payment";
                }
            });
        }

        // Run init on page load
        window.onload = init;
    </script>
</body>
</html>
