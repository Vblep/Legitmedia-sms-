<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support - Legit Media SMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.3); }
        .input-style { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(71, 85, 105, 0.4); border-radius: 1rem; padding: 1rem; width: 100%; outline: none; transition: all 0.3s; color: white; }
        .input-style:focus { border-color: #6366f1; box-shadow: 0 0 15px rgba(99, 102, 241, 0.2); }
        .btn-glow:hover { box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); transform: translateY(-2px); }
        select option { background: #0f172a; color: white; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <nav class="p-6">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-white shadow-lg text-xs">LM</div>
                <span class="text-lg font-black tracking-tighter uppercase">Legit<span class="text-indigo-500">Media</span></span>
            </a>
            <a href="dashboard.html" class="text-[10px] font-black uppercase tracking-widest text-slate-500 hover:text-white transition-colors">Back to Dashboard</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 mt-10 grid grid-cols-1 lg:grid-cols-2 gap-12 items-start">
        
        <div class="space-y-8">
            <div class="space-y-4">
                <h1 class="text-5xl font-black leading-tight">Need help <br><span class="text-indigo-500">with an order?</span></h1>
                <p class="text-slate-400 text-lg font-medium">Our average response time for wallet and SMS issues is under 15 minutes during business hours.</p>
            </div>

            <div class="space-y-4">
                <div class="glass p-6 rounded-3xl flex items-center gap-5 border-l-4 border-l-emerald-500">
                    <div class="w-12 h-12 bg-emerald-500/10 text-emerald-500 rounded-2xl flex items-center justify-center">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                    </div>
                    <div>
                        <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Instant Support</p>
                        <a href="https://wa.me/2349119012234" class="text-lg font-bold hover:text-emerald-500 transition-colors">09119012234</a>
                    </div>
                </div>

                <div class="glass p-6 rounded-3xl flex items-center gap-5 border-l-4 border-l-indigo-500">
                    <div class="w-12 h-12 bg-indigo-500/10 text-indigo-500 rounded-2xl flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-width="2"/></svg>
                    </div>
                    <div>
                        <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Direct Email</p>
                        <p class="text-lg font-bold">ebuvick0@gmail.com</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="glass p-8 md:p-10 rounded-[3rem] shadow-2xl relative">
            <h3 class="text-2xl font-black mb-6">Send a <span class="text-indigo-500">Ticket</span></h3>
            
            <form action="https://formspree.io/f/movkwado" method="POST" class="space-y-5">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">Full Name</label>
                        <input type="text" name="name" placeholder="John Doe" class="input-style mt-1.5" required>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">Email Address</label>
                        <input type="email" name="email" placeholder="john@example.com" class="input-style mt-1.5" required>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">What's the issue?</label>
                    <select name="issue_type" class="input-style mt-1.5 appearance-none cursor-pointer">
                        <option value="Wallet Not Funded">Wallet Funding Issue (Bank/Card)</option>
                        <option value="OTP Not Received">SMS Code Not Arriving</option>
                        <option value="Account Issue">Login / Account Security</option>
                        <option value="Bulk Inquiry">Bulk Numbers / Partnership</option>
                    </select>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">Transaction Ref or Phone Number (Optional)</label>
                    <input type="text" name="reference" placeholder="e.g. LM-DEP-172..." class="input-style mt-1.5">
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">Message</label>
                    <textarea name="message" rows="4" placeholder="Please describe the issue in detail..." class="input-style mt-1.5 resize-none" required></textarea>
                </div>

                <input type="hidden" name="_subject" value="New Support Ticket from Legit Media">

                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 py-5 rounded-2xl font-black uppercase text-xs tracking-[0.2em] shadow-xl shadow-indigo-500/20 btn-glow transition-all">
                    Submit Ticket
                </button>
            </form>
            </div>

    </main>

    <script>
        // Simple loading state for the button
        document.querySelector('form').addEventListener('submit', function() {
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = `<span class="animate-pulse">SENDING TICKET...</span>`;
            btn.style.opacity = '0.7';
            btn.disabled = true;
        });
    </script>

</body>
</html>
