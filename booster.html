<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Boost - Legit Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .shimmer { background: linear-gradient(90deg, #6366f1, #a855f7); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .modal-overlay { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-up { animation: slideUp 0.4s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen text-slate-800 pb-20">

    <div id="success-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-6 modal-overlay">
        <div class="bg-white rounded-[2.5rem] w-full max-w-sm p-8 text-center shadow-2xl animate-up">
            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full mx-auto flex items-center justify-center mb-6">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
            </div>
            <h3 class="text-2xl font-black text-slate-900 leading-tight">Order Launched!</h3>
            <p class="text-sm font-medium text-slate-500 mt-2">Your boost campaign has been successfully initiated.</p>
            <div class="mt-8 space-y-3">
                <button onclick="window.location.href='activity.html'" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black uppercase tracking-widest text-[10px] shadow-lg shadow-indigo-200">Track My Order</button>
                <button onclick="location.reload()" class="w-full py-4 bg-slate-100 text-slate-600 rounded-2xl font-black uppercase tracking-widest text-[10px]">Place Another</button>
            </div>
        </div>
    </div>

    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='dashboard.html'">
                <div class="w-8 h-8 shimmer rounded-lg flex items-center justify-center shadow-lg shadow-indigo-200">
                    <span class="text-white font-bold text-xs">LM</span>
                </div>
                <span class="font-extrabold text-xl tracking-tighter uppercase">LEGIT<span class="text-indigo-600">MEDIA</span></span>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p id="nav-balance" class="text-sm font-extrabold text-indigo-600 tracking-tighter">₦--.--</p>
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Wallet</p>
                </div>
                <div id="user-initials" class="w-9 h-9 rounded-full bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600 font-bold text-xs uppercase shadow-sm">..</div>
            </div>
        </div>
    </nav>

    <main class="max-w-lg mx-auto px-4 mt-6 space-y-6">
        <div class="glass-card rounded-[2.5rem] p-8 shadow-2xl shadow-indigo-100/40 space-y-6">
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">1. Platform</label>
                    <select id="categorySelect" onchange="filterServices()" class="w-full p-4 mt-2 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-sm outline-none appearance-none">
                        <option>Loading Platforms...</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">2. Package</label>
                    <select id="serviceSelect" onchange="updateQuantityPlaceholder()" class="w-full p-4 mt-2 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-sm outline-none appearance-none">
                        <option>Select Platform first...</option>
                    </select>
                </div>
                <div class="grid grid-cols-1 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Target Link</label>
                        <input type="text" id="targetLink" placeholder="https://..." class="w-full p-4 mt-2 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-sm outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Quantity</label>
                        <input type="number" id="quantity" oninput="calculateTotal()" placeholder="0" class="w-full p-4 mt-2 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-sm outline-none">
                    </div>
                </div>
            </div>

            <div class="shimmer p-8 rounded-[2rem] text-center text-white shadow-xl shadow-indigo-200/50">
                <p class="text-[10px] font-bold opacity-80 uppercase tracking-widest mb-1">Total Cost</p>
                <h2 id="finalPriceDisplay" class="text-5xl font-black tracking-tighter">₦0.00</h2>
            </div>

            <button id="buyBtn" onclick="handleOrder()" class="w-full py-5 bg-slate-900 text-white rounded-2xl font-black uppercase tracking-widest text-xs">
                Launch Boost Campaign
            </button>
        </div>
    </main>

<script>
const SB_URL = "https://gfhbwybslaxgdzcqkzra.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmaGJ3eWJzbGF4Z2R6Y3FrenJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NzI1NDUsImV4cCI6MjA4NzU0ODU0NX0.EkmUwtBi9OiScuMt9PELS6-vDXgQVofvadJ8aLFvyKo";
const WORKER = "https://booster.ebuvick0.workers.dev"; 
const PROFIT_X = 2.0; 

const sb = supabase.createClient(SB_URL, SB_KEY);
let userData, currentBalance, allServices = [];

async function init() {
    try {
        const { data: { session } } = await sb.auth.getSession();
        if (!session) return window.location.href = 'login.html';
        userData = session.user;

        const { data: profile } = await sb.from('profiles').select('*').eq('id', userData.id).single();
        if (profile) {
            currentBalance = profile.wallet_balance;
            document.getElementById('nav-balance').innerText = "₦" + (currentBalance || 0).toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('user-initials').innerText = (profile.full_name || "??").substring(0,2).toUpperCase();
        }
        await loadSMMData();
    } catch (e) { console.error("Init Error:", e); }
}

async function loadSMMData() {
    try {
        const res = await fetch(`${WORKER}/get-services`);
        allServices = await res.json();
        const categories = [...new Set(allServices.map(s => s.category))].sort();
        document.getElementById('categorySelect').innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
        filterServices();
    } catch (e) { console.error(e); }
}

function filterServices() {
    const selectedCat = document.getElementById('categorySelect').value;
    const filtered = allServices.filter(s => s.category === selectedCat);
    document.getElementById('serviceSelect').innerHTML = filtered.map(s => {
        const publicRate = (parseFloat(s.rate) * PROFIT_X).toFixed(2);
        return `<option value="${s.service}" data-rate="${s.rate}" data-min="${s.min}" data-max="${s.max}" data-name="${s.name}">${s.name} — ₦${publicRate}/1k</option>`;
    }).join('');
    updateQuantityPlaceholder();
}

function updateQuantityPlaceholder() {
    const opt = document.getElementById('serviceSelect').selectedOptions[0];
    if (opt) document.getElementById('quantity').placeholder = `Min: ${opt.getAttribute('data-min')}`;
    calculateTotal();
}

function calculateTotal() {
    const qty = parseFloat(document.getElementById('quantity').value) || 0;
    const opt = document.getElementById('serviceSelect').selectedOptions[0];
    if (!opt) return;
    const rate = parseFloat(opt.getAttribute('data-rate'));
    const total = (rate * PROFIT_X / 1000) * qty;
    document.getElementById('finalPriceDisplay').innerText = "₦" + total.toLocaleString(undefined, {minimumFractionDigits: 2});
}

async function handleOrder() {
    const qty = parseInt(document.getElementById('quantity').value) || 0;
    const link = document.getElementById('targetLink').value.trim();
    const opt = document.getElementById('serviceSelect').selectedOptions[0];
    const cat = document.getElementById('categorySelect').value;
    
    if (!opt || !link || qty <= 0) return alert("Please fill all details.");
    
    const price = parseFloat(document.getElementById('finalPriceDisplay').innerText.replace('₦', '').replace(/,/g, ''));
    if (currentBalance < price) return alert("Insufficient Balance.");

    const btn = document.getElementById('buyBtn');
    btn.innerText = "PROCESSING...";
    btn.disabled = true;

    try {
        const res = await fetch(`${WORKER}/order`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: userData.id, serviceId: opt.value, link, quantity: qty })
        });
        const result = await res.json();
        if (result.error) throw new Error(result.error);

        // Record for history using your verified column names
        const { error: txError } = await sb.from('transactions').insert([{
            user_id: userData.id,
            amount: -price,
            type: 'Social Boost',
            description: `${cat}: ${opt.getAttribute('data-name')}`,
            status: 'Processing',
            recipient: link,
            api_order_id: result.order.toString(),
            service_name: opt.getAttribute('data-name'),
            service_category: 'boost',
            quantity: qty,
            reference_id: 'BST-' + Date.now().toString().slice(-6)
        }]);

        if (txError) throw txError;

        // Update DB and UI
        currentBalance -= price;
        await sb.from('profiles').update({ wallet_balance: currentBalance }).eq('id', userData.id);
        document.getElementById('nav-balance').innerText = "₦" + currentBalance.toLocaleString(undefined, {minimumFractionDigits: 2});
        
        document.getElementById('success-modal').classList.remove('hidden');
        document.getElementById('success-modal').classList.add('flex');
    } catch (err) {
        alert("Order Error: " + err.message);
        btn.innerText = "Launch Boost Campaign";
        btn.disabled = false;
    }
}

window.onload = init;
</script>
</body>
</html>
